name: Release

# Pushing a tag like v1.2.3 does the whole release + Homebrew sync in one go:
#   1. build darwin/linux/windows binaries (arm64 + amd64 each)
#   2. publish a GitHub Release with those binaries attached
#   3. push an updated formula to 320exh/homebrew-prompt-diff (macOS + Linux —
#      Homebrew doesn't run on Windows, so Windows users stay on the .exe
#      download below or `go install`)
#
# Requires a repo secret HOMEBREW_TAP_TOKEN: a PAT (classic or fine-grained)
# with `contents: write` on 320exh/homebrew-prompt-diff. The default
# GITHUB_TOKEN can't push to a different repo.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded dashboard
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Fail if embedded dist is stale
        run: |
          if ! git diff --quiet -- internal/uiserver/dist; then
            echo "::error::internal/uiserver/dist is out of date for this tag. Rebuild and commit before tagging."
            exit 1
          fi

      - name: Derive version
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -o dist/prompt-diff-darwin-arm64 -ldflags "-X github.com/320exh/prompt-diff/cmd.Version=${{ steps.ver.outputs.tag }}" .
          GOOS=darwin GOARCH=amd64 go build -o dist/prompt-diff-darwin-amd64 -ldflags "-X github.com/320exh/prompt-diff/cmd.Version=${{ steps.ver.outputs.tag }}" .
          GOOS=linux GOARCH=arm64 go build -o dist/prompt-diff-linux-arm64 -ldflags "-X github.com/320exh/prompt-diff/cmd.Version=${{ steps.ver.outputs.tag }}" .
          GOOS=linux GOARCH=amd64 go build -o dist/prompt-diff-linux-amd64 -ldflags "-X github.com/320exh/prompt-diff/cmd.Version=${{ steps.ver.outputs.tag }}" .
          GOOS=windows GOARCH=arm64 go build -o dist/prompt-diff-windows-arm64.exe -ldflags "-X github.com/320exh/prompt-diff/cmd.Version=${{ steps.ver.outputs.tag }}" .
          GOOS=windows GOARCH=amd64 go build -o dist/prompt-diff-windows-amd64.exe -ldflags "-X github.com/320exh/prompt-diff/cmd.Version=${{ steps.ver.outputs.tag }}" .

      - name: Checksums
        id: sha
        run: |
          echo "arm64=$(sha256sum dist/prompt-diff-darwin-arm64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "amd64=$(sha256sum dist/prompt-diff-darwin-amd64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum dist/prompt-diff-linux-arm64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$(sha256sum dist/prompt-diff-linux-amd64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            dist/prompt-diff-darwin-arm64 \
            dist/prompt-diff-darwin-amd64 \
            dist/prompt-diff-linux-arm64 \
            dist/prompt-diff-linux-amd64 \
            dist/prompt-diff-windows-arm64.exe \
            dist/prompt-diff-windows-amd64.exe \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set — cannot push formula update. Release binaries were still published."
            exit 1
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/320exh/homebrew-prompt-diff.git" tap
          cd tap

          version="${{ steps.ver.outputs.version }}"
          tag="${{ steps.ver.outputs.tag }}"

          # Regenerate the formula from scratch each release rather than
          # sed-patching the tap's copy — keeps this workflow the single
          # source of truth for its structure (e.g. adding a new platform
          # stanza here is enough; no separate manual edit to the tap repo).
          arm64_sha="${{ steps.sha.outputs.arm64 }}"
          amd64_sha="${{ steps.sha.outputs.amd64 }}"
          linux_arm64_sha="${{ steps.sha.outputs.linux_arm64 }}"
          linux_amd64_sha="${{ steps.sha.outputs.linux_amd64 }}"

          printf '%s\n' \
            'class PromptDiff < Formula' \
            '  desc "Version, diff, and benchmark LLM system prompts"' \
            '  homepage "https://github.com/320exh/prompt-diff"' \
            '  license "MIT"' \
            "  version \"${version}\"" \
            '' \
            '  on_macos do' \
            '    if Hardware::CPU.arm?' \
            "      url \"https://github.com/320exh/prompt-diff/releases/download/${tag}/prompt-diff-darwin-arm64\"" \
            "      sha256 \"${arm64_sha}\"" \
            '    else' \
            "      url \"https://github.com/320exh/prompt-diff/releases/download/${tag}/prompt-diff-darwin-amd64\"" \
            "      sha256 \"${amd64_sha}\"" \
            '    end' \
            '  end' \
            '' \
            '  on_linux do' \
            '    if Hardware::CPU.arm?' \
            "      url \"https://github.com/320exh/prompt-diff/releases/download/${tag}/prompt-diff-linux-arm64\"" \
            "      sha256 \"${linux_arm64_sha}\"" \
            '    else' \
            "      url \"https://github.com/320exh/prompt-diff/releases/download/${tag}/prompt-diff-linux-amd64\"" \
            "      sha256 \"${linux_amd64_sha}\"" \
            '    end' \
            '  end' \
            '' \
            '  def install' \
            '    bin.install Dir["prompt-diff-*"].first => "prompt-diff"' \
            '  end' \
            '' \
            '  test do' \
            "    assert_match \"${tag}\", shell_output(\"#{bin}/prompt-diff version\")" \
            '  end' \
            'end' \
            > prompt-diff.rb

          if git diff --quiet; then
            echo "Formula already up to date; nothing to commit."
            exit 0
          fi

          git config user.name "prompt-diff-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prompt-diff.rb
          git commit -m "chore: sync formula to ${tag}"
          git push origin HEAD:main
