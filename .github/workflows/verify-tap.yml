name: Verify Homebrew tap

# Manual check that `brew install 320exh/prompt-diff/prompt-diff` actually
# works end-to-end on both platforms the tap claims to support. Run this
# after any change to the release workflow's tap-sync step, or whenever in
# doubt about tap health.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Homebrew (Linux only)
        if: runner.os == 'Linux'
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: brew install
        run: brew install 320exh/prompt-diff/prompt-diff

      - name: Run installed binary
        run: |
          prompt-diff version
          prompt-diff --help
